[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prolog-agent-toolkit"
version = "0.0.1.dev1"
description = "Multi-engine, cross-platform Prolog safety runner and agent toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Unlicense" }
authors = [
    { name = "Doug Ransom" }
]
dependencies = [
    "psutil>=5.9.0",
]

[project.scripts]
prolog-safe = "prolog_agent_toolkit.cli:prolog_safe_main"
scryer-safe = "prolog_agent_toolkit.cli:scryer_safe_main"
swi-safe = "prolog_agent_toolkit.cli:swi_safe_main"
trealla-safe = "prolog_agent_toolkit.cli:trealla_safe_main"

[tool.hatch.build.targets.wheel]
packages = ["prolog_agent_toolkit"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"

