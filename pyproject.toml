[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prolog-agent-toolkit"
version = "0.0.1.dev5"
description = "Multi-engine, cross-platform Prolog safety runner and agent toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Unlicense" }
authors = [
    { name = "Doug Ransom" }
]
keywords = [
    "prolog",
    "scryer-prolog",
    "swi-prolog",
    "trealla-prolog",
    "tau-prolog",
    "agent-toolkit",
    "antigravity",
    "claude-code",
    "copilot",
    "cursor",
    "aidermacs",
    "agent-shell",
    "gptel",
    "emacs",
    "dcg",
    "clpz",
    "purity",
    "sandboxing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Prolog",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
prolog-agent = "prolog_agent_toolkit.cli:prolog_agent_main"
prolog-safe = "prolog_agent_toolkit.cli:prolog_safe_main"
scryer-safe = "prolog_agent_toolkit.cli:scryer_safe_main"
swi-safe = "prolog_agent_toolkit.cli:swi_safe_main"
trealla-safe = "prolog_agent_toolkit.cli:trealla_safe_main"
tau-safe = "prolog_agent_toolkit.cli:tau_safe_main"
prolog-validate-skills = "prolog_agent_toolkit.cli:validate_skills_main"

[tool.hatch.build.targets.wheel]
packages = ["prolog_agent_toolkit"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"

